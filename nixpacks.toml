[phases.setup]
nixPkgs = [
  "php82",
  "python311",
  "python311Packages.pip",
  "gcc-unwrapped",
  "stdenv.cc.cc.lib"
]

[phases.install]
cmds = [
  "pip install --no-cache-dir --break-system-packages -r python-service/requirements.txt"
]

[phases.build]
cmds = [
  "echo 'Build complete'"
]

[start]
cmd = "python start.py"